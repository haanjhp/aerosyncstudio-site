<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Privacy Policy - ManualSync | AeroSync Studio</title>
  <style>
    /* 기본 스타일 및 배경 (기존 디자인 유지) */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #0c4a6e 0%, #075985 100%); 
      color: #f8fafc;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
      min-height: 100vh; padding: 20px;
    }
    a { color: #7dd3fc; text-decoration: none; transition: 0.2s; }
    a:hover { text-decoration: underline; }

    header { width: 100%; max-width: 800px; text-align: center; padding: 40px 0 20px; }
    header h1 { font-size: 32px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 8px; color: #f0f9ff; }
    header h2 { font-size: 18px; font-weight: 400; color: #bae6fd; }

    main { width: 100%; max-width: 800px; display: flex; flex-direction: column; padding: 20px 0 60px; }
    
    .privacy-card {
      background: rgba(255, 255, 255, 0.08); 
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 24px; 
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 30px; text-align: left; line-height: 1.7; color: #f0f9ff;
      position: relative;
    }

    /* 언어 선택 스위처 스타일 */
    .lang-switcher {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-bottom: 20px;
    }
    .lang-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #bae6fd;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    .lang-btn:hover { background: rgba(255, 255, 255, 0.2); }
    .lang-btn.active {
      background: #7dd3fc;
      color: #0c4a6e;
      border-color: #7dd3fc;
    }
    
    .back-link { display: inline-block; margin-bottom: 25px; font-weight: 600; color: #7dd3fc; }
    .privacy-card h3 { font-size: 20px; color: #f8fafc; margin-top: 30px; margin-bottom: 12px; border-bottom: 1px solid rgba(255, 255, 255, 0.15); padding-bottom: 8px; }
    .privacy-card p, .privacy-card ul { font-size: 15px; margin-bottom: 16px; opacity: 0.95; }
    .privacy-card ul { padding-left: 24px; }
    .privacy-card li { margin-bottom: 6px; }

    .local-info {
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 22px;
      border-radius: 16px;
      margin-top: 15px;
    }
    .local-info strong { color: #7dd3fc; font-weight: 700; }

    @media (min-width: 768px) {
      header { padding: 60px 0 30px; }
      header h1 { font-size: 40px; }
      .privacy-card { padding: 50px; }
    }

    footer {
      width: 100%; max-width: 800px; text-align: center; padding: 40px 0;
      border-top: 1px solid rgba(255, 255, 255, 0.1); font-size: 14px; color: #bae6fd;
    }
  </style>
</head>
<body>

  <header>
    <h1>ManualSync</h1>
    <h2 id="page-subtitle">개인정보처리방침 (Privacy Policy)</h2>
  </header>

  <main>
    <section class="privacy-card">
      <div class="lang-switcher">
        <button class="lang-btn active" onclick="setLanguage('ko')">KO</button>
        <button class="lang-btn" onclick="setLanguage('en')">EN</button>
        <button class="lang-btn" onclick="setLanguage('ja')">JA</button>
        <button class="lang-btn" onclick="setLanguage('zh')">ZH</button>
      </div>

      <a href="index.html" class="back-link" id="back-home">← 메인 홈페이지로 돌아가기</a>
      
      <p><strong id="effective-date">시행일자: 2026년 4월 26일</strong></p>
      
      <div id="privacy-content">
        </div>
    </section>
  </main>

  <footer>
    <p id="footer-contact">문의: contact@aerosyncstudio.kr</p>
    <p>© 2026 AeroSync Studio. All rights reserved.</p>
  </footer>

  <script>
    const translations = {
      ko: {
        subtitle: "개인정보처리방침 (Privacy Policy)",
        back: "← 메인 홈페이지로 돌아가기",
        date: "시행일자: 2026년 4월 26일",
        contact: "문의: contact@aerosyncstudio.kr",
        content: `
          <h3>1. 개인정보의 처리 원칙</h3>
          <p>ManualSync는 사용자의 프라이버시를 최우선으로 생각합니다. 본 앱은 원칙적으로 <strong>사용자의 문서를 외부 서버로 전송하지 않는 On-device 처리 방식</strong>을 채택하고 있습니다.</p>
          <h3>2. 처리하는 데이터 항목</h3>
          <div class="local-info">
            <p><strong>중요 안내:</strong> ManualSync는 사용자가 불러오는 PDF 파일, 북마크, 주석 데이터를 <strong>일체 서버로 전송하거나 수집하지 않습니다.</strong></p>
            <ul>
              <li>모든 데이터는 기기 내에서 로컬로만 처리됩니다.</li>
              <li>주석 정보는 마이그레이션 과정에서 일시적으로만 활용됩니다.</li>
            </ul>
          </div>
          <h3>3. 인앱 결제 정보</h3>
          <p>결제 관련 모든 과정은 <strong>Apple App Store 결제 시스템</strong>을 통해서만 처리됩니다. 회사는 사용자의 금융 정보를 직접 수집하거나 보유하지 않습니다.</p>
          <h3>4. 문의처</h3>
          <p>문의사항은 <a href="mailto:contact@aerosyncstudio.kr">contact@aerosyncstudio.kr</a>로 연락 주시기 바랍니다.</p>
        `
      },
      en: {
        subtitle: "Privacy Policy",
        back: "← Back to Home",
        date: "Effective Date: April 26, 2026",
        contact: "Contact: contact@aerosyncstudio.kr",
        content: `
          <h3>1. Guiding Principles</h3>
          <p>ManualSync prioritizes your privacy. We use <strong>On-device processing</strong>, meaning your documents are never sent to external servers.</p>
          <h3>2. Data Processing</h3>
          <div class="local-info">
            <p><strong>Important:</strong> ManualSync <strong>does not collect or transmit</strong> your PDF files, bookmarks, or annotations to any server.</p>
            <ul>
              <li>All processing happens locally on your device.</li>
              <li>Data is only used temporarily during the migration process.</li>
            </ul>
          </div>
          <h3>3. In-App Purchases</h3>
          <p>All payments are handled securely by the <strong>Apple App Store</strong>. We do not collect or store your credit card or financial information.</p>
          <h3>4. Contact Us</h3>
          <p>If you have questions, contact us at <a href="mailto:contact@aerosyncstudio.kr">contact@aerosyncstudio.kr</a>.</p>
        `
      },
      ja: {
        subtitle: "プライバシーポリシー (Privacy Policy)",
        back: "← ホームに戻る",
        date: "施行日: 2026년 4월 26일",
        contact: "お問い合わせ: contact@aerosyncstudio.kr",
        content: `
          <h3>1. 個人情報処理の原則</h3>
          <p>ManualSyncはお客様のプライバシーを最優先に考えています。原則として<strong>ユーザーの文書を外部サーバーに送信しないオンデバイス(On-device)処理方式</strong>を採用しています。</p>
          <h3>2. 処理するデータ項目</h3>
          <div class="local-info">
            <p><strong>重要事項:</strong> ManualSyncは、ユーザーが読み込むPDFファイル、しおり、注釈データを<strong>一切サーバーに送信したり収集したりしません。</strong></p>
            <ul>
              <li>すべてのデータはデバイス内でローカルにのみ処理されます。</li>
              <li>注釈情報は移行プロセスで一時的にのみ活用されます。</li>
            </ul>
          </div>
          <h3>3. App内課金情報</h3>
          <p>決済に関するすべてのプロセスは<strong>Apple App Store決済システム</strong>を通じてのみ処理されます。当社はユーザーの金融情報を直接収集したり保有したりしません。</p>
        `
      },
      zh: {
        subtitle: "隐私政策 (Privacy Policy)",
        back: "← 返回主页",
        date: "生效日期：2026年4월 26일",
        contact: "联系我们: contact@aerosyncstudio.kr",
        content: `
          <h3>1. 个人信息处理原则</h3>
          <p>ManualSync 将用户的隐私置于首位。本应用原则上采用<strong>不在外部服务器传输用户文档的离线处理(On-device)方式</strong>。</p>
          <h3>2. 处理的数据项目</h3>
          <div class="local-info">
            <p><strong>重要提示：</strong> ManualSync <strong>绝不会向服务器传输或收集</strong>用户读取的 PDF 文件、书签或注释数据。</p>
            <ul>
              <li>所有数据仅在设备本地处理。</li>
              <li>注释信息仅在迁移过程中临时使用。</li>
            </ul>
          </div>
          <h3>3. 应用内购买信息</h3>
          <p>所有支付流程均通过 <strong>Apple App Store 支付系统</strong>处理。本公司不直接收集或保留用户的财务信息。</p>
        `
      }
    };

    function setLanguage(lang) {
      // 콘텐츠 업데이트
      document.getElementById('page-subtitle').innerText = translations[lang].subtitle;
      document.getElementById('back-home').innerText = translations[lang].back;
      document.getElementById('effective-date').innerText = translations[lang].date;
      document.getElementById('footer-contact').innerText = translations[lang].contact;
      document.getElementById('privacy-content').innerHTML = translations[lang].content;

      // 버튼 활성화 상태 변경
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.remove('active');
        if (btn.innerText.toLowerCase() === lang) {
          btn.classList.add('active');
        }
      });

      // HTML lang 속성 업데이트
      document.documentElement.lang = lang;
    }

    // 초기 언어 설정 (브라우저 언어 감지 또는 기본값 'ko')
    const userLang = navigator.language.substring(0, 2);
    if (translations[userLang]) {
      setLanguage(userLang);
    } else {
      setLanguage('ko');
    }
  </script>
</body>
</html>
